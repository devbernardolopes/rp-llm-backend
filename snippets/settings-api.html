<div class="settings-group" data-settings-group="api"></div>
<div class="settings-group" data-settings-group="appearance"></div>
<div class="settings-group" data-settings-group="threads"></div>
<div class="settings-group" data-settings-group="prompting"></div>
<div class="settings-group" data-settings-group="shortcuts"></div>
<div class="settings-group" data-settings-group="defaults"></div>
        </div>
      </div>
    </div>

    <div
      id="assets-modal"
      class="modal hidden"
      role="dialog"
      aria-modal="true"
      aria-labelledby="assets-title"
    >
      <div class="modal-card wide">
        <div class="modal-header">
<h3 id="assets-title" data-i18n="assetsManager">Assets Manager</h3>
<button class="icon-btn modal-close" data-close-modal>&times;</button>
        </div>
        <div class="modal-body">
<div id="assets-dropzone-section">
  <button
    type="button"
    id="assets-dropzone"
    class="assets-dropzone"
    tabindex="0"
    aria-label="Upload asset"
  >
    <span class="dropzone-plus">+</span>
    <span class="dropzone-hint" data-i18n="assetsDropzoneHint"
      >Drag & drop or click to add assets</span
    >
  </button>
  <input
    type="file"
    id="assets-file-input"
    accept="image/*,video/*,audio/*"
    multiple
    class="visually-hidden"
  />
</div>
<div id="assets-list" class="lorebook-list"></div>
        </div>
      </div>
    </div>

    <div
      id="memory-modal"
      class="modal hidden"
      role="dialog"
      aria-modal="true"
      aria-labelledby="memory-modal-title"
    >
      <div class="modal-card wide">
        <div class="modal-header">
<h3 id="memory-modal-title" data-i18n="memoryModalTitle">
  Memory entries
</h3>
<button class="icon-btn modal-close" data-close-modal>&times;</button>
        </div>
        <div class="modal-body">
<p id="memory-modal-status" class="muted"></p>
<div id="memory-modal-entries"></div>
        </div>
        <div class="modal-footer">
<button
  id="memory-modal-save"
  class="primary-btn"
  type="button"
  data-i18n="save"
  disabled
>
  Save
</button>
        </div>
      </div>
    </div>

    <div
      id="memory-regenerate-prompt-modal"
      class="modal hidden"
      role="dialog"
      aria-modal="true"
      aria-labelledby="memory-regenerate-prompt-title"
    >
      <div class="modal-card wide">
        <div class="modal-header">
<h3
  id="memory-regenerate-prompt-title"
  data-i18n="memoryRegeneratePromptTitle"
>
  Regenerate Memory Entry
</h3>
<button
  type="button"
  class="icon-btn modal-close"
  data-memory-regenerate-prompt-close
  aria-label="Close"
>
  &times;
</button>
        </div>
        <div class="modal-body">
<div class="memory-regenerate-prompt-info">
  <p id="memory-regenerate-prompt-entry-label" class="muted"></p>
  <p
    id="memory-regenerate-prompt-description"
    class="muted"
    data-i18n="memoryRegeneratePromptDescription"
  >
    Edit the USER prompt that generated this summary before
    regenerating.
  </p>
</div>
<textarea
  id="memory-regenerate-prompt-input"
  rows="8"
  placeholder=""
></textarea>
<span
  id="memory-regenerate-prompt-input-count"
  class="textarea-collapse-count memory-regenerate-word-count"
></span>
        </div>
        <div class="modal-footer">
<button
  type="button"
  class="secondary-btn"
  data-memory-regenerate-prompt-close
  data-i18n="cancel"
>
  Cancel
</button>
<button
  type="button"
  class="primary-btn"
  id="memory-regenerate-prompt-submit"
  data-i18n="memoryEntryRegenerate"
>
  Regenerate
</button>
        </div>
      </div>
    </div>
    <div
      id="memory-regenerate-progress-modal"
      class="modal hidden"
      role="dialog"
      aria-modal="true"
      aria-labelledby="memory-regenerate-progress-title"
    >
      <div class="modal-card medium">
        <div class="modal-header">
<h3
  id="memory-regenerate-progress-title"
  data-i18n="memoryRegenerateProgressTitle"
>
  Summary regeneration
</h3>
<button
  type="button"
  class="icon-btn modal-close"
  data-memory-regenerate-progress-close-btn
  aria-label="Close"
>
  &times;
</button>
        </div>
        <div class="modal-body">
<div class="chat-row chat-row-ooc memory-regenerate-progress-row">
  <img
    id="memory-regenerate-progress-avatar"
    class="chat-avatar"
    src="data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMSIgaGVpZ2h0PSIxIiB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciPjxyZWN0IHdpZHRoPSIxIiBoZWlnaHQ9IjEiIGZpbGw9InRyYW5zcGFyZW50Ii8+PC9zdmc+"
    alt="SYSTEM avatar"
  />
  <div class="message-block">
    <div class="message-header">
      <span data-i18n="systemRoleName">SYSTEM</span>
      <span
        id="memory-regenerate-progress-entry-label"
        class="muted"
      ></span>
    </div>
    <div class="message-content memory-regenerate-progress-content">
      <span
        class="spinner memory-regenerate-progress-spinner"
        aria-hidden="true"
      ></span>
      <span
        id="memory-regenerate-progress-status"
        data-i18n="memoryRegenerateProgressPending"
      >
        Regenerating summary...
      </span>
    </div>
  </div>
</div>
        </div>
        <div class="modal-footer">
<button
  type="button"
  class="danger-btn"
  id="memory-regenerate-progress-cancel"
  data-i18n="memoryRegenerateProgressCancel"
>
  Cancel
</button>
<button
  type="button"
  class="primary-btn"
  id="memory-regenerate-progress-close"
  data-memory-regenerate-progress-close-btn
  data-i18n="memoryRegenerateProgressClose"
>
  Close
</button>
        </div>
      </div>
    </div>

    <div
      id="asset-editor-modal"
      class="modal hidden"
      role="dialog"
      aria-modal="true"
      aria-labelledby="asset-editor-title"
    >
      <div class="modal-card wide">
        <div class="modal-header">
<h3 id="asset-editor-title" data-i18n="assetEditor">Asset Editor</h3>
<button class="icon-btn modal-close" data-close-modal>&times;</button>
        </div>
        <div class="modal-body">
<div class="form-field">
  <div class="label-inline">
    <span data-i18n="nameLabel">Name</span>
    <span id="asset-name-count" class="muted">0/128</span>
  </div>
  <input id="asset-name" type="text" maxlength="128" />
</div>
<div class="form-field">
  <span data-i18n="assetOriginalName">Original Filename</span>
  <input id="asset-original-name" type="text" disabled />
</div>
